<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOKDO - VAMPIR CLAN SYSTEM</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131b2e',
                        borderBg: '#1e293b',
                        gold: '#f59e0b',
                        cyanAccent: '#06b6d4',
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase App & Firestore SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDummyKey_For_Static_Canvas_App",
            authDomain: "clan-dokdo-app.firebaseapp.com",
            projectId: "clan-dokdo-app",
            storageBucket: "clan-dokdo-app.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef123456789"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let state = {
            members: [],
            notices: [
                { id: 1, title: "DOKDO 클랜 시스템에 오신 것을 환영합니다.", content: "출석체크 및 다이아 정산을 편리하게 이용하세요." }
            ],
            attendance: {},
            accounts: {}
        };

        const docRef = doc(db, "artifacts", "clan-app", "public", "data", "clan", "mainState");

        signInAnonymously(auth).then(() => {
            onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    state = { ...state, ...snapshot.data() };
                    renderApp();
                } else {
                    saveStateToFirestore();
                }
            });
        }).catch(() => {
            const localData = localStorage.getItem("dokdo_state");
            if (localData) state = JSON.parse(localData);
            renderApp();
        });

        window.saveStateToFirestore = function() {
            setDoc(docRef, state).catch(() => {
                localStorage.setItem("dokdo_state", JSON.stringify(state));
            });
        };

        window.getState = () => state;
        window.getCurrentUser = () => currentUser;
        window.setCurrentUser = (u) => { currentUser = u; renderApp(); };
    </script>

    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Auth Gateway Modal -->
    <div id="authModal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-cardBg border border-cyanAccent/30 rounded-xl p-6 w-full max-w-md shadow-2xl">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-extrabold text-cyanAccent tracking-widest">DOKDO</h1>
                <p class="text-xs text-gray-400 mt-1">VAMPIR CLAN MANAGEMENT SYSTEM</p>
            </div>

            <!-- Tab Switch -->
            <div class="flex border-b border-gray-700 mb-6">
                <button id="loginTabBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 font-bold text-cyanAccent border-b-2 border-cyanAccent">로그인</button>
                <button id="signupTabBtn" onclick="switchAuthTab('signup')" class="flex-1 py-2 font-bold text-gray-400 border-b-2 border-transparent hover:text-white">회원가입</button>
            </div>

            <!-- LOGIN FORM -->
            <div id="loginForm">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">아이디 (게임 닉네임)</label>
                        <input type="text" id="loginId" placeholder="예: DOKDO로이" class="w-full bg-darkBg border border-gray-700 rounded p-2.5 text-white focus:border-cyanAccent outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">비밀번호</label>
                        <input type="password" id="loginPw" placeholder="비밀번호 입력" class="w-full bg-darkBg border border-gray-700 rounded p-2.5 text-white focus:border-cyanAccent outline-none">
                    </div>
                    <button onclick="handleLogin()" class="w-full bg-cyanAccent hover:bg-cyan-500 text-black font-bold py-3 rounded shadow transition mt-2">로그인</button>
                </div>
            </div>

            <!-- SIGNUP FORM -->
            <div id="signupForm" class="hidden">
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">사용할 아이디 (클랜 명단 연동 닉네임)</label>
                        <input type="text" id="signupId" placeholder="예: DOKDO로이" class="w-full bg-darkBg border border-gray-700 rounded p-2.5 text-white focus:border-cyanAccent outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">비밀번호</label>
                        <input type="password" id="signupPw" placeholder="비밀번호 설정" class="w-full bg-darkBg border border-gray-700 rounded p-2.5 text-white focus:border-cyanAccent outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">클래스(직업)</label>
                            <select id="signupClass" class="w-full bg-darkBg border border-gray-700 rounded p-2.5 text-white outline-none">
                                <option>검사</option>
                                <option>마법사</option>
                                <option>궁수</option>
                                <option>암살자</option>
                                <option>힐러</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">전투력</label>
                            <input type="number" id="signupCp" placeholder="예: 150000" class="w-full bg-darkBg border border-gray-700 rounded p-2.5 text-white outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-gold mb-1">운영진 인증 암호 (선택사항)</label>
                        <input type="password" id="signupAdminCode" placeholder="운영진만 입력 (일반 클랜원은 빈칸)" class="w-full bg-darkBg border border-amber-900/50 rounded p-2.5 text-white outline-none">
                    </div>
                    <button onclick="handleSignup()" class="w-full bg-gold hover:bg-amber-500 text-black font-bold py-3 rounded shadow transition mt-2">회원가입 및 명단 등록</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="mainApp" class="hidden flex-1 flex flex-col md:flex-row">
        <!-- Sidebar Navigation -->
        <aside class="w-full md:w-64 bg-cardBg border-r border-gray-800 p-4 flex flex-col justify-between">
            <div>
                <div class="flex items-center space-x-2 mb-8">
                    <i data-lucide="shield" class="text-gold w-8 h-8"></i>
                    <div>
                        <h2 class="font-black text-xl text-white tracking-wider">DOKDO</h2>
                        <span class="text-[10px] text-cyanAccent">CLAN SYSTEM</span>
                    </div>
                </div>

                <nav class="space-y-1">
                    <button onclick="switchTab('dashboard')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded text-sm font-semibold bg-cyanAccent/10 text-cyanAccent">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i><span>대시보드</span>
                    </button>
                    <button onclick="switchTab('notice')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded text-sm font-semibold text-gray-400 hover:bg-gray-800 hover:text-white">
                        <i data-lucide="megaphone" class="w-4 h-4"></i><span>공지사항</span>
                    </button>
                    <button onclick="switchTab('members')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded text-sm font-semibold text-gray-400 hover:bg-gray-800 hover:text-white">
                        <i data-lucide="users" class="w-4 h-4"></i><span>클랜원 명단</span>
                    </button>
                    <button onclick="switchTab('attendance')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded text-sm font-semibold text-gray-400 hover:bg-gray-800 hover:text-white">
                        <i data-lucide="calendar-check" class="w-4 h-4"></i><span>출석 체크</span>
                    </button>
                    <button onclick="switchTab('diamonds')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded text-sm font-semibold text-gray-400 hover:bg-gray-800 hover:text-white">
                        <i data-lucide="gem" class="w-4 h-4"></i><span>다이아 분배</span>
                    </button>
                </nav>
            </div>

            <!-- Logged-in User Profile -->
            <div class="pt-4 border-t border-gray-800 flex items-center justify-between">
                <div>
                    <div id="userDisplayName" class="text-sm font-bold text-white">---</div>
                    <div id="userDisplayRole" class="text-xs text-gold">---</div>
                </div>
                <button onclick="handleLogout()" title="로그아웃" class="text-gray-400 hover:text-red-400">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </aside>

        <!-- Main Dynamic Content Container -->
        <main class="flex-1 p-6 overflow-y-auto">
            <!-- DASHBOARD TAB -->
            <section id="tab-dashboard" class="tab-content active space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold text-white">클랜 대시보드</h2>
                    <span class="text-xs bg-cyanAccent/20 text-cyanAccent px-3 py-1 rounded-full border border-cyanAccent/30">실시간 연동 중</span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-cardBg p-5 rounded-lg border border-gray-800">
                        <span class="text-xs text-gray-400">전체 등록 클랜원</span>
                        <p id="dashTotalMembers" class="text-3xl font-black text-cyanAccent mt-1">0 명</p>
                    </div>
                    <div class="bg-cardBg p-5 rounded-lg border border-gray-800">
                        <span class="text-xs text-gray-400">클랜 총 전투력</span>
                        <p id="dashTotalCp" class="text-3xl font-black text-gold mt-1">0</p>
                    </div>
                    <div class="bg-cardBg p-5 rounded-lg border border-gray-800">
                        <span class="text-xs text-gray-400">평균 전투력</span>
                        <p id="dashAvgCp" class="text-3xl font-black text-white mt-1">0</p>
                    </div>
                </div>

                <div class="bg-cardBg p-5 rounded-lg border border-gray-800">
                    <h3 class="text-lg font-bold text-white mb-3 flex items-center space-x-2">
                        <i data-lucide="bell" class="w-5 h-5 text-gold"></i><span>주요 클랜 공지</span>
                    </h3>
                    <div id="dashNoticeContainer" class="space-y-2 text-sm text-gray-300">
                        <p class="text-gray-500">등록된 공지사항이 없습니다.</p>
                    </div>
                </div>
            </section>

            <!-- NOTICES TAB -->
            <section id="tab-notice" class="tab-content space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold text-white">클랜 공지사항 및 규칙</h2>
                </div>

                <!-- Admin Notice Input -->
                <div id="adminNoticeForm" class="hidden bg-cardBg p-4 rounded-lg border border-amber-900/40 space-y-3">
                    <h3 class="text-sm font-bold text-gold">📢 [운영진 권한] 새 공지사항 등록</h3>
                    <input type="text" id="noticeTitleInput" placeholder="공지 제목" class="w-full bg-darkBg border border-gray-700 rounded p-2 text-white text-sm outline-none">
                    <textarea id="noticeContentInput" placeholder="공지 내용" class="w-full bg-darkBg border border-gray-700 rounded p-2 text-white text-sm outline-none h-20"></textarea>
                    <button onclick="addNotice()" class="bg-gold text-black font-bold text-xs px-4 py-2 rounded">공지 등록</button>
                </div>

                <div class="bg-cardBg p-5 rounded-lg border border-gray-800 space-y-4">
                    <div id="noticeList" class="space-y-3"></div>
                </div>
            </section>

            <!-- MEMBERS TAB -->
            <section id="tab-members" class="tab-content space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold text-white">클랜원 명단 및 역할 관리</h2>
                </div>

                <div class="bg-cardBg rounded-lg border border-gray-800 overflow-x-auto">
                    <table class="w-full text-left text-sm text-gray-300">
                        <thead class="bg-gray-900 text-gray-400 uppercase text-xs">
                            <tr>
                                <th class="p-3">닉네임(아이디)</th>
                                <th class="p-3">클래스</th>
                                <th class="p-3">전투력</th>
                                <th class="p-3">역할</th>
                                <th class="p-3 admin-col hidden text-right">관리</th>
                            </tr>
                        </thead>
                        <tbody id="memberTableBody" class="divide-y divide-gray-800"></tbody>
                    </table>
                </div>
            </section>

            <!-- ATTENDANCE TAB -->
            <section id="tab-attendance" class="tab-content space-y-6">
                <h2 class="text-2xl font-bold text-white">출석 체크</h2>
                <div class="bg-cardBg p-5 rounded-lg border border-gray-800">
                    <p class="text-sm text-gray-400 mb-4">내 출석을 체크하면 실시간 현황에 즉시 반영됩니다.</p>
                    <div id="attendanceList" class="space-y-3"></div>
                </div>
            </section>

            <!-- DIAMONDS TAB -->
            <section id="tab-diamonds" class="tab-content space-y-6">
                <h2 class="text-2xl font-bold text-white">💎 다이아 분배 계산기</h2>
                <div class="bg-cardBg p-5 rounded-lg border border-gray-800 space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">분배할 총 다이아 수량</label>
                        <input type="number" id="totalDiaInput" oninput="calculateDia()" placeholder="예: 100000" class="w-full bg-darkBg border border-gray-700 rounded p-3 text-white focus:border-cyanAccent outline-none">
                    </div>
                    <div id="diaResultTable" class="overflow-x-auto"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Application Script -->
    <script>
        function switchAuthTab(tab) {
            document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
            document.getElementById('signupForm').classList.toggle('hidden', tab !== 'signup');
            
            document.getElementById('loginTabBtn').className = tab === 'login' 
                ? 'flex-1 py-2 font-bold text-cyanAccent border-b-2 border-cyanAccent' 
                : 'flex-1 py-2 font-bold text-gray-400 border-b-2 border-transparent hover:text-white';
                
            document.getElementById('signupTabBtn').className = tab === 'signup' 
                ? 'flex-1 py-2 font-bold text-gold border-b-2 border-gold' 
                : 'flex-1 py-2 font-bold text-gray-400 border-b-2 border-transparent hover:text-white';
        }

        function handleSignup() {
            const id = document.getElementById('signupId').value.trim();
            const pw = document.getElementById('signupPw').value.trim();
            const cls = document.getElementById('signupClass').value;
            const cp = parseInt(document.getElementById('signupCp').value) || 0;
            const adminCode = document.getElementById('signupAdminCode').value.trim();

            if (!id || !pw) return alert("아이디와 비밀번호를 입력해주세요.");

            const state = window.getState();
            if (state.accounts && state.accounts[id]) return alert("이미 존재하는 아이디입니다.");

            // 운영진 코드 1273 확인
            const role = (adminCode === "1273") ? '운영진' : '일반 클랜원';

            state.accounts = state.accounts || {};
            state.accounts[id] = { password: pw, role: role, class: cls, cp: cp };

            state.members = state.members || [];
            if (!state.members.some(m => m.username === id)) {
                state.members.push({ username: id, class: cls, cp: cp, role: role });
            }

            window.saveStateToFirestore();
            alert(`회원가입이 완료되었습니다! (권한: ${role})`); window.setCurrentUser({ username: id, role: role }); }  function handleLogin() { const id = document.getElementById('loginId').value.trim(); const pw = document.getElementById('loginPw').value.trim();  const state = window.getState(); if (state.accounts && state.accounts[id] && state.accounts[id].password === pw) { window.setCurrentUser({ username: id, role: state.accounts[id].role \vert{}\vert{} '일반 클랜원' }); } else { alert("아이디 또는 비밀번호가 올바르지 않습니다."); } }  function handleLogout() { window.setCurrentUser(null); }  function switchTab(tabId) { document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active')); document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        function deleteMember(username) {
            if (!confirm(`${username} 님을 명단에서 삭제하시겠습니까?`)) return; const state = window.getState(); state.members = state.members.filter(m => m.username !== username); delete state.accounts[username]; window.saveStateToFirestore(); }  function addNotice() { const title = document.getElementById('noticeTitleInput').value.trim(); const content = document.getElementById('noticeContentInput').value.trim(); if (!title) return alert("공지 제목을 입력해 주세요.");  const state = window.getState(); state.notices = state.notices \vert{}\vert{} []; state.notices.unshift({ id: Date.now(), title, content }); window.saveStateToFirestore();  document.getElementById('noticeTitleInput').value = ''; document.getElementById('noticeContentInput').value = ''; }  function deleteNotice(id) { if (!confirm("이 공지를 삭제하시겠습니까?")) return; const state = window.getState(); state.notices = state.notices.filter(n => n.id !== id); window.saveStateToFirestore(); }  function renderApp() { const user = window.getCurrentUser(); const state = window.getState();  if (!user) { document.getElementById('authModal').classList.remove('hidden'); document.getElementById('mainApp').classList.add('hidden'); return; }  document.getElementById('authModal').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden');  const isAdmin = (user.role === '운영진');  document.getElementById('userDisplayName').innerText = user.username; document.getElementById('userDisplayRole').innerText = user.role;  // 운영진 전용 UI 토글 document.querySelectorAll('.admin-col').forEach(el => el.classList.toggle('hidden', !isAdmin)); document.getElementById('adminNoticeForm').classList.toggle('hidden', !isAdmin);  // Members Data const members = state.members \vert{}\vert{} []; document.getElementById('dashTotalMembers').innerText = `${members.length} 명`;
            
            const totalCp = members.reduce((acc, cur) => acc + (cur.cp || 0), 0);
            document.getElementById('dashTotalCp').innerText = totalCp.toLocaleString();
            document.getElementById('dashAvgCp').innerText = members.length ? Math.round(totalCp / members.length).toLocaleString() : 0;

            const tableBody = document.getElementById('memberTableBody');
            tableBody.innerHTML = members.map(m => `
                <tr class="hover:bg-gray-800/50">
                    <td class="p-3 font-bold text-white">${m.username}</td>
                    <td class="p-3">${m.class}</td>
                    <td class="p-3 font-mono text-gold">${(m.cp || 0).toLocaleString()}</td>
                    <td class="p-3 text-xs"><span class="${m.role === '운영진' ? 'bg-amber-900/50 text-gold border-amber-600' : 'bg-gray-800 text-gray-300 border-gray-700'} px-2 py-1 rounded border">${m.role}</span></td>${isAdmin ? `<td class="p-3 text-right"><button onclick="deleteMember('${m.username}')" class="text-xs text-red-400 hover:text-red-300">삭제</button></td>` : ''}
                </tr>
            `).join('');

            // Notices Data
            const notices = state.notices || [];
            const dashNoticeContainer = document.getElementById('dashNoticeContainer');
            if (notices.length > 0) {
                dashNoticeContainer.innerHTML = notices.slice(0, 3).map(n => `
                    <div class="border-b border-gray-800 pb-2">
                        <div class="font-bold text-cyanAccent">${n.title}</div>
                        <div class="text-xs text-gray-400 mt-0.5">${n.content}</div>
                    </div>
                `).join('');
            } else {
                dashNoticeContainer.innerHTML = `<p class="text-gray-500">등록된 공지사항이 없습니다.</p>`;
            }

            const noticeList = document.getElementById('noticeList');
            noticeList.innerHTML = notices.map(n => `
                <div class="border-b border-gray-800 pb-3 flex justify-between items-start">
                    <div>
                        <h4 class="font-bold text-white">${n.title}</h4>
                        <p class="text-sm text-gray-400 mt-1">${n.content}</p>
                    </div>
                    ${isAdmin ? `<button onclick="deleteNotice(${n.id})" class="text-xs text-red-400 hover:text-red-300 ml-4">삭제</button>` : ''}
                </div>
            `).join('');

            lucide.createIcons();
        }

        function calculateDia() {
            const totalDia = parseInt(document.getElementById('totalDiaInput').value) || 0;
            const members = window.getState().members || [];
            
            if (!members.length) return;
            const perMember = Math.floor(totalDia / members.length);

            document.getElementById('diaResultTable').innerHTML = `
                <table class="w-full text-left text-sm text-gray-300 mt-4">
                    <thead class="bg-gray-900 text-gray-400 uppercase text-xs">
                        <tr><th class="p-2">닉네임</th><th class="p-2">분배 수량</th></tr>
