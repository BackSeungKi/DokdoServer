<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOKDO - Clan Management Dashboard</title>
  <!-- Tailwind CSS -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',

          fontFamily: {
            sans: ['Inter', 'sans-serif'],

              purple: '#8B5CF6',
              danger: '#EF4444'
            }
          }
        }
      }
    }
  </script>

  <style>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      signInAnonymously, 
      signInWithCustomToken, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      onSnapshot, 
      collection, 
      addDoc, 
      updateDoc, 
      deleteDoc 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Application ID and Default Config fallback
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'dokdo-clan-v1';
    
    // Config parsing with fallback mock object to prevent crash if not injected
    let firebaseConfig = {};
    try {
      if (typeof __firebase_config !== 'undefined' && __firebase_config) {
        firebaseConfig = JSON.parse(__firebase_config);
      } else {
        // Dummy fallback config for non-configured env (prevents runtime code crash)
        firebaseConfig = {
          apiKey: "demo-api-key",
          authDomain: "demo-app.firebaseapp.com",
          projectId: "demo-app",
          storageBucket: "demo-app.appspot.com",
          messagingSenderId: "123456789",
          appId: "1:123456789:web:demo"
        };
      }
    } catch(e) {
      console.warn("Firebase Config fallback active:", e);
    }

    let app, db, auth;
    let currentUser = null;
    let isFirebaseReady = false;

    // Default In-Memory Initial Data
    let clanState = {
      announcements: [
        { id: '1', title: '클랜 셔플 14기 진행 안내', content: '이번 셔플 기간은 14일간 진행되며, 출석 및 보스 참여율을 기반으로 다이아 분배가 이뤄집니다.', date: '2026-10-20' },
        { id: '2', title: '점령전 및 쟁탈전 필참 안내', content: '토요일 21시 보스전 및 PVP 점수 반영 비중이 높으니 운영진 안내에 따라주세요.', date: '2026-10-22' }
      ],
      members: [
        { id: 'm1', name: '독도대장', role: '군주', class: '기사', combatPower: 850000, memo: '메인 탱커' },
        { id: 'm2', name: '칼날바람', role: '부군주', class: '암살자', combatPower: 790000, memo: 'PVP 리더' },
        { id: 'm3', name: '힐링마스터', role: '수호자', class: '사제', combatPower: 680000, memo: '전담 힐러' },
        { id: 'm4', name: '불꽃마법', role: '정예', class: '마법사', combatPower: 720000, memo: '딜러' },
        { id: 'm5', name: '샤도우', role: '혈맹원', class: '도적', combatPower: 610000, memo: '출석 양호' }
      ],
      attendance: [
        { id: 'a1', memberId: 'm1', memberName: '독도대장', g13: true, g21: true, satBoss: true, pvp: true, lucif: true, points: 5 },
        { id: 'a2', memberId: 'm2', memberName: '칼날바람', g13: true, g21: true, satBoss: true, pvp: true, lucif: false, points: 4 },
        { id: 'a3', memberId: 'm3', memberName: '힐링마스터', g13: false, g21: true, satBoss: true, pvp: true, lucif: true, points: 4 },
        { id: 'a4', memberId: 'm4', memberName: '불꽃마법', g13: true, g21: false, satBoss: true, pvp: false, lucif: true, points: 3 },
        { id: 'a5', memberId: 'm5', memberName: '샤도우', g13: false, g21: true, satBoss: false, pvp: true, lucif: true, points: 3 }
      ],
      bossTimers: [
        { id: 'b1', name: '게헨나 보스 13시', time: '13:00', intervalHours: 24 },
        { id: 'b2', name: '게헨나 보스 21시', time: '21:00', intervalHours: 24 },
        { id: 'b3', name: '루체프 영지 보스', time: '22:30', intervalHours: 12 }
      ],
      settings: {
        passcode: "1273",
        shufflePeriod: "14기 (10.15 ~ 10.29)"
      }
    };

    // Firebase Auth & Data Listener Setup
    async function initFirebase() {
      try {
        app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        // Rule 3: Auth First
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        currentUser = auth.currentUser;
        if (!currentUser) return;

        // Display connected status
        const syncBadge = document.getElementById('syncBadge');
        if (syncBadge) {
          syncBadge.innerHTML = `<i class="fa-solid fa-signal text-emerald-400 mr-1"></i> 실시간 DB 연결됨 (UID: ${currentUser.uid.substring(0, 6)}...)`;
          syncBadge.className = "text-xs font-medium text-emerald-400 bg-emerald-950/60 border border-emerald-500/30 px-3 py-1 rounded-full flex items-center";
        }

        isFirebaseReady = true;

        // Rule 1: Public Collection Path
        const stateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'clan', 'mainState');

        // Rule 2: Simple snapshot without complex order
        onSnapshot(stateDocRef, (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.data();
            if (data && data.clanData) {
              clanState = data.clanData;
              window.renderCurrentTab();
            }
          } else {
            // First time initialization in Cloud Firestore
            setDoc(stateDocRef, { clanData: clanState, updatedAt: new Date().toISOString() });
          }
        }, (error) => {
          console.warn("Firestore snapshot listener notice:", error);
        });

      } catch (err) {
        console.warn("Running in local offline mode (Firebase setup skipped):", err);
        const syncBadge = document.getElementById('syncBadge');
        if (syncBadge) {
          syncBadge.innerHTML = `<i class="fa-solid fa-floppy-disk text-amber-400 mr-1"></i> 로컬 오프라인 모드`;
          syncBadge.className = "text-xs font-medium text-amber-400 bg-amber-950/60 border border-amber-500/30 px-3 py-1 rounded-full flex items-center";
        }
      }
    }

    // Helper function to save changes to DB or Local
    window.saveClanData = async function() {
      if (isFirebaseReady && currentUser) {
        try {
          const stateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'clan', 'mainState');
          await setDoc(stateDocRef, { clanData: clanState, updatedAt: new Date().toISOString() });
        } catch (e) {
          console.error("Error saving to Firestore:", e);
        }
      }
      // Re-render immediately for fluid experience
      window.renderCurrentTab();
    };

    window.getClanState = () => clanState;

    window.addEventListener('DOMContentLoaded', () => {
      initFirebase();
    });
  </script>
</head>

<body class="bg-brand-dark text-slate-100 font-sans min-h-screen flex flex-col md:flex-row antialiased selection:bg-brand-accent selection:text-black">

  <!-- Mobile Top Bar -->
  <header class="md:hidden bg-brand-card border-b border-brand-border p-4 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-shield-halved text-brand-gold text-2xl"></i>
      <span class="font-display font-bold text-xl text-slate-100 tracking-wider">DOKDO CLAN</span>
    </div>
    <button id="mobileMenuBtn" class="p-2 text-slate-400 hover:text-white focus:outline-none">
      <i class="fa-solid fa-bars text-xl"></i>
    </button>
  </header>

  <!-- Navigation Sidebar -->
  <aside id="sidebar" class="hidden md:flex flex-col w-full md:w-64 bg-brand-card border-r border-brand-border p-4 shrink-0 transition-all duration-300 z-40">
    <!-- Header / Logo -->
    <div class="flex items-center space-x-3 px-2 py-3 mb-6 border-b border-brand-border/60">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-gold to-amber-600 flex items-center justify-center text-slate-950 font-bold shadow-lg glow-gold">
        <i class="fa-solid fa-dragon text-xl"></i>
      </div>
      <div>
        <h1 class="font-display font-bold text-xl text-white tracking-wider leading-none">DOKDO</h1>
        <p class="text-xs text-brand-accent font-medium tracking-widest mt-1">VAMPIRE SYSTEM</p>
      </div>
    </div>

    <!-- DB Sync Badge Status -->
    <div class="mb-6 px-2">
      <div id="syncBadge" class="text-xs font-medium text-slate-400 bg-slate-800/80 border border-slate-700/50 px-3 py-1.5 rounded-full flex items-center">
        <i class="fa-solid fa-circle-notch fa-spin text-brand-accent mr-2"></i> DB 연결 확인 중...
      </div>

    <!-- Navigation Links -->
    <nav class="space-y-1.5 flex-1" id="mainNav">
      <button onclick="switchTab('dashboard')" data-tab="dashboard" class="nav-link w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-colors bg-brand-accent/10 text-brand-accent border border-brand-accent/30">
        <i class="fa-solid fa-chart-pie w-5 text-center"></i>
        <span>대시보드 (Dashboard)</span>
      </button>

      <button onclick="switchTab('announcements')" data-tab="announcements" class="nav-link w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/50 transition-colors">
        <i class="fa-solid fa-bullhorn w-5 text-center"></i>
        <span>공지 & 점수 안내</span>
      </button>

      <button onclick="switchTab('members')" data-tab="members" class="nav-link w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/50 transition-colors">
        <i class="fa-solid fa-users w-5 text-center"></i>
        <span>클랜원 & 투력 관리</span>
      </button>

      <button onclick="switchTab('attendance')" data-tab="attendance" class="nav-link w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/50 transition-colors">
        <i class="fa-solid fa-clipboard-user w-5 text-center"></i>
        <span>출석 체크 & 점수</span>
      </button>

      <button onclick="switchTab('diamonds')" data-tab="diamonds" class="nav-link w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/50 transition-colors">
        <i class="fa-solid fa-gem w-5 text-center text-cyan-400"></i>
        <span>다이아 자동 분배기</span>
      </button>

      <button onclick="switchTab('timers')" data-tab="timers" class="nav-link w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/50 transition-colors">
        <i class="fa-solid fa-stopwatch w-5 text-center text-amber-400"></i>
        <span>보스 타임 계산기</span>
      </button>

      <button onclick="switchTab('ladder')" data-tab="ladder" class="nav-link w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/50 transition-colors">
        <i class="fa-solid fa-dice w-5 text-center text-purple-400"></i>
        <span>클랜 사다리타기</span>
      </button>
    </nav>

    <!-- Footer info -->
    <div class="pt-4 mt-auto border-t border-brand-border/60 text-xs text-slate-500 flex justify-between items-center">
      <span>DOKDO System v2.5</span>
      <span class="text-brand-gold font-mono">14 Shuffle</span>
    </div>
  </aside>

  <!-- Main Content Body -->
  <main class="flex-1 p-4 md:p-8 overflow-y-auto min-h-screen">
    <div id="contentArea" class="max-w-6xl mx-auto space-y-6">
      <!-- Dynamic View Rendered Here -->
    </div>
  </main>

  <!-- Modal Container for Passwords & Custom Dialogs -->
  <div id="customModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div id="modalCard" class="bg-brand-card border border-brand-border rounded-xl max-w-md w-full p-6 shadow-2xl relative">
      <h3 id="modalTitle" class="text-lg font-bold text-white mb-2">알림</h3>
      <div id="modalBody" class="text-sm text-slate-300 mb-6">내용</div>
      <div id="modalActions" class="flex justify-end space-x-3">
        <!-- Action Buttons Injected Dynamically -->
      </div>
    </div>
  </div>

  <!-- Application Logic JavaScript -->
  <script>
    // Current Active Navigation State
    let currentTab = 'dashboard';

    // Toggle Mobile Navigation Menu
    document.getElementById('mobileMenuBtn').addEventListener('click', () => {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('hidden');
    });

    // Tab Switcher
    window.switchTab = function(tabName) {
      currentTab = tabName;
      
      // Update Active Navigation Class Styles
      document.querySelectorAll('.nav-link').forEach(btn => {
        if (btn.dataset.tab === tabName) {
          btn.className = "nav-link w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-colors bg-brand-accent/10 text-brand-accent border border-brand-accent/30";
        } else {
          btn.className = "nav-link w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/50 transition-colors border border-transparent";
        }
      });

      // Hide sidebar on mobile after clicking
      if (window.innerWidth < 768) {
        document.getElementById('sidebar').classList.add('hidden');
      }

      window.renderCurrentTab();
    };

    // Render Handler according to currentTab
    window.renderCurrentTab = function() {
      const state = window.getClanState ? window.getClanState() : {};
      const container = document.getElementById('contentArea');
      if (!container) return;

      switch(currentTab) {
        case 'dashboard': renderDashboard(container, state); break;
        case 'announcements': renderAnnouncements(container, state); break;
        case 'members': renderMembers(container, state); break;
        case 'attendance': renderAttendance(container, state); break;
        case 'diamonds': renderDiamonds(container, state); break;
        case 'timers': renderTimers(container, state); break;
        case 'ladder': renderLadder(container, state); break;
        default: renderDashboard(container, state);
      }
    };

    // --- 1. DASHBOARD VIEW ---
    function renderDashboard(container, state) {
      const members = state.members || [];
      const totalCombatPower = members.reduce((sum, m) => sum + (m.combatPower || 0), 0);
      const avgCombatPower = members.length ? Math.round(totalCombatPower / members.length) : 0;
      const announcements = state.announcements || [];

      container.innerHTML = `
        <!-- Top Stats Overview -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="bg-brand-card border border-brand-border p-5 rounded-xl flex items-center space-x-4">
            <div class="p-3 bg-brand-accent/10 text-brand-accent rounded-lg border border-brand-accent/20">
              <i class="fa-solid fa-users text-2xl"></i>
            </div>
            <div>
              <p class="text-xs text-slate-400 font-medium">전체 혈맹원</p>
              <h3 class="text-2xl font-bold font-display text-white mt-0.5">${members.length}명</h3>
            </div>
          </div>

          <div class="bg-brand-card border border-brand-border p-5 rounded-xl flex items-center space-x-4">
            <div class="p-3 bg-brand-gold/10 text-brand-gold rounded-lg border border-brand-gold/20">
              <i class="fa-solid fa-swords text-2xl"></i>
            </div>
            <div>
              <p class="text-xs text-slate-400 font-medium">혈맹 총 전투력</p>
              <h3 class="text-2xl font-bold font-display text-white mt-0.5">${(totalCombatPower / 10000).toFixed(1)}만</h3>
            </div>
          </div>

          <div class="bg-brand-card border border-brand-border p-5 rounded-xl flex items-center space-x-4">
            <div class="p-3 bg-purple-500/10 text-purple-400 rounded-lg border border-purple-500/20">
              <i class="fa-solid fa-shield-virus text-2xl"></i>
            </div>
            <div>
              <p class="text-xs text-slate-400 font-medium">평균 전투력</p>
              <h3 class="text-2xl font-bold font-display text-white mt-0.5">${(avgCombatPower / 10000).toFixed(1)}만</h3>
            </div>
          </div>

          <div class="bg-brand-card border border-brand-border p-5 rounded-xl flex items-center space-x-4">
            <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-lg border border-emerald-500/20">
              <i class="fa-solid fa-calendar-check text-2xl"></i>
            </div>
            <div>
              <p class="text-xs text-slate-400 font-medium">현재 셔플 회차</p>
              <h3 class="text-xl font-bold font-display text-white mt-0.5">${state.settings?.shufflePeriod || '14기'}</h3>
            </div>
          </div>
        </div>

        <!-- Middle Grid: Notice & Clan Rank Preview -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <!-- Recent Notices -->
          <div class="lg:col-span-2 bg-brand-card border border-brand-border rounded-xl p-6">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-brand-border/60">
              <h2 class="text-lg font-bold text-white flex items-center">
                <i class="fa-solid fa-bullhorn text-brand-gold mr-2.5"></i> 최신 클랜 공지사항
              </h2>
              <button onclick="switchTab('announcements')" class="text-xs text-brand-accent hover:underline">전체보기 &rarr;</button>
            </div>
            <div class="space-y-3">
              ${announcements.slice(0, 3).map(item => `
                <div class="p-4 bg-slate-900/60 rounded-lg border border-slate-800/60 hover:border-brand-accent/40 transition">
                  <div class="flex items-center justify-between mb-1">
                    <span class="font-semibold text-slate-100">${escapeHtml(item.title)}</span>
                    <span class="text-xs font-mono text-slate-500">${item.date}</span>
                  </div>
                  <p class="text-sm text-slate-400 line-clamp-2">${escapeHtml(item.content)}</p>
                </div>
              `).join('')}
              ${announcements.length === 0 ? '<p class="text-sm text-slate-500 py-4 text-center">등록된 공지사항이 없습니다.</p>' : ''}
            </div>
          </div>

          <!-- Top Combat Power Members -->
          <div class="bg-brand-card border border-brand-border rounded-xl p-6">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-brand-border/60">
              <h2 class="text-lg font-bold text-white flex items-center">
                <i class="fa-solid fa-crown text-brand-gold mr-2.5"></i> 전투력 TOP 5
              </h2>
              <button onclick="switchTab('members')" class="text-xs text-brand-accent hover:underline">전체 순위 &rarr;</button>
            </div>
            <div class="space-y-2.5">
              ${[...members].sort((a,b) => b.combatPower - a.combatPower).slice(0, 5).map((m, idx) => `
                <div class="flex items-center justify-between p-2.5 rounded-lg bg-slate-900/40 border border-slate-800/40">
                  <div class="flex items-center space-x-3">
                    <span class="w-6 h-6 rounded-full font-bold text-xs flex items-center justify-center ${
                      idx === 0 ? 'bg-amber-400 text-slate-950 glow-gold' :
                      idx === 1 ? 'bg-slate-300 text-slate-950' :
                      idx === 2 ? 'bg-amber-700 text-white' : 'bg-slate-800 text-slate-400'
                    }">${idx + 1}</span>
                    <div>
                      <div class="text-sm font-semibold text-slate-200">${escapeHtml(m.name)}</div>
                      <div class="text-xs text-slate-500">${escapeHtml(m.role)} · ${escapeHtml(m.class)}</div>
                    </div>
                  </div>
                  <div class="text-sm font-bold font-mono text-brand-accent">
                    ${(m.combatPower / 10000).toFixed(1)}만
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // --- 2. ANNOUNCEMENTS & RULES VIEW ---
    function renderAnnouncements(container, state) {
      const announcements = state.announcements || [];

      container.innerHTML = `

    window.calculateDistributions = function() {
      const state = window.getClanState();
      const members = state.members || [];
      const attendance = state.attendance || [];

      const totalDia = parseFloat(document.getElementById('totalDiaInput')?.value) || 0;
      const feeRate = parseFloat(document.getElementById('feeRateInput')?.value) || 0;

      const netDia = totalDia * (1 - (feeRate / 100));
      const netText = document.getElementById('netDiamondText');
      if (netText) netText.innerText = `정산 가능 다이아: ${Math.floor(netDia).toLocaleString()} Dia`;

      // Calculate total weight (Attendance Points * CP Weight)
      let totalWeight = 0;
      const memberCalculations = members.map(m => {
        const att = attendance.find(a => a.memberId === m.id) || { points: 1 };
        const pts = Math.max(att.points, 1); // Minimum score 1
        const cpWeight = m.combatPower || 100000;
        const scoreWeight = pts * (cpWeight / 100000);
        totalWeight += scoreWeight;

        return {
          member: m,
          points: att.points,
          weight: scoreWeight
        };
      });

      const tbody = document.getElementById('distributionTableBody');
      if (!tbody) return;

      tbody.innerHTML = memberCalculations.map(item => {
        const share = totalWeight > 0 ? (item.weight / totalWeight) : 0;
        const rewardDia = Math.floor(netDia * share);

        return `
          <tr class="hover:bg-slate-800/40 transition">
            <td class="py-3.5 px-4 font-bold text-white">${escapeHtml(item.member.name)}</td>
            <td class="py-3.5 px-4 text-center font-mono text-brand-gold">${item.points}점</td>
            <td class="py-3.5 px-4 text-right font-mono">${(item.member.combatPower).toLocaleString()}</td>
            <td class="py-3.5 px-4 text-right font-mono text-slate-400">${(share * 100).toFixed(1)}%</td>
            <td class="py-3.5 px-4 text-right font-mono font-bold text-lg text-cyan-400">
              <i class="fa-solid fa-gem text-xs mr-1 text-cyan-400"></i>${rewardDia.toLocaleString()}
            </td>
          </tr>
        `;
      }).join('');
    };

    // --- 6. BOSS TIMERS VIEW ---
    function renderTimers(container, state) {
      const timers = state.bossTimers || [];

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <h2 class="text-2xl font-bold font-display text-white">보스 젠 타임 계산기</h2>
            <p class="text-sm text-slate-400">주요 보스 출현 타임 및 젠 시간을 관리합니다.</p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          ${timers.map(timer => `
            <div class="bg-brand-card border border-brand-border rounded-xl p-6 flex flex-col justify-between space-y-4">
              <div>
                <div class="flex items-center justify-between mb-2">
                  <h3 class="font-bold text-lg text-white">${escapeHtml(timer.name)}</h3>
                  <span class="text-xs text-amber-400 bg-amber-950/60 border border-amber-500/30 px-2 py-0.5 rounded font-mono">${timer.intervalHours}시간 주기</span>
                </div>
                <div class="text-3xl font-display font-bold text-brand-accent font-mono my-3">${timer.time}</div>
                <p class="text-xs text-slate-500">다음 예상 젠 타임 자동 계산 중</p>
              </div>
              <button onclick="alert('${timer.name} 보스 알림이 설정되었습니다.')" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-lg text-sm transition">
                알림 받기
              </button>
            </div>
          `).join('')}
        </div>
      `;
    }

    // --- 7. LADDER MINI GAME ---
    function renderLadder(container, state) {
      const members = (state.members || []).slice(0, 6);

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <h2 class="text-2xl font-bold font-display text-white">클랜원 사다리타기 미니게임</h2>
            <p class="text-sm text-slate-400">아이템, 벌칙, 당번 정하기용 간이 사다리 게임입니다.</p>
          </div>
          <button onclick="drawLadderGame()" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-lg text-sm flex items-center space-x-2 transition shadow-md">
            <i class="fa-solid fa-play"></i>
            <span>사다리 생성/시작</span>
          </button>
        </div>

        <div class="bg-brand-card border border-brand-border p-6 rounded-xl flex flex-col items-center justify-center">
          <canvas id="ladderCanvas" width="600" height="400" class="w-full max-w-2xl border border-slate-800 rounded-lg shadow-inner"></canvas>
          <div class="mt-4 text-xs text-slate-400 flex items-center space-x-2">
            <i class="fa-solid fa-circle-info text-brand-accent"></i>
            <span>상단 캐릭터명을 클릭하여 결과를 확인하세요.</span>
          </div>
        </div>
      `;

      setTimeout(drawLadderGame, 100);
    }

    window.drawLadderGame = function() {
      const canvas = document.getElementById('ladderCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const state = window.getClanState();
      const members = (state.members || []).slice(0, 5);

      if (members.length < 2) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#9CA3AF';
        ctx.font = '14px Inter';
        ctx.fillText('최소 2명 이상의 클랜원이 필요합니다.', 180, 200);
        return;
      }

      const numLines = members.length;
      const width = canvas.width;
      const height = canvas.height;
      const padding = 60;
      const stepX = (width - padding * 2) / (numLines - 1);

      ctx.clearRect(0, 0, width, height);

      // Draw Vertical Lines & Member Names
      ctx.strokeStyle = '#374151';
      ctx.lineWidth = 4;
      ctx.font = '12px Inter';
      ctx.fillStyle = '#F59E0B';
      ctx.textAlign = 'center';

      for (let i = 0; i < numLines; i++) {
        const x = padding + i * stepX;
        ctx.beginPath();
        ctx.moveTo(x, 50);
        ctx.lineTo(x, height - 50);
        ctx.stroke();

        ctx.fillText(members[i].name, x, 35);
        ctx.fillText(`벌칙 ${i + 1}`, x, height - 25);
      }

      // Generate Rungs
      ctx.strokeStyle = '#06B6D4';
      ctx.lineWidth = 2;
      for (let i = 0; i < numLines - 1; i++) {
        const x1 = padding + i * stepX;
        const x2 = padding + (i + 1) * stepX;
        for (let j = 0; j < 3; j++) {
          const y = 80 + (j * 90) + (Math.random() * 30);
          ctx.beginPath();
          ctx.moveTo(x1, y);
          ctx.lineTo(x2, y + (Math.random() * 20 - 10));
          ctx.stroke();
        }
      }
    };

    // Global Modal Helpers
    window.closeModal = function() {
      document.getElementById('customModal').classList.add('hidden');
    };

    // Helper Utility: Safe HTML Escape
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Initial View Render
    window.renderCurrentTab();
  </script>
</body>
</html>
