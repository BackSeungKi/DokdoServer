<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOKDO - VAMPIR CLAN SYSTEM</title>
    
    <!-- 회원 데이터 파일 먼저 불러오기 -->
    <script src="members.js"></script>
    <!-- 메인 자바스크립트 연결 -->
    <script src="app.js" defer></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131b2e',
                        borderBg: '#1e293b',
                        gold: '#f59e0b',
                        cyanAccent: '#06b6d4',
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- 커스텀 스타일시트 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">

    <!-- Auth Modal (로그인 / 회원가입 창) -->
    <div id="authModal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-cardBg border border-cyanAccent/30 rounded-xl p-6 w-full max-w-md shadow-2xl">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-extrabold text-cyanAccent tracking-widest">DOKDO</h1>
                <p class="text-xs text-gray-400 mt-1">VAMPIR CLAN MANAGEMENT SYSTEM</p>
            </div>

            <!-- Tab Switch Buttons -->
            <div class="flex border-b border-gray-700 mb-6">
                <button id="loginTabBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 font-bold text-cyanAccent border-b-2 border-cyanAccent">로그인</button>
                <button id="signupTabBtn" onclick="switchAuthTab('signup')" class="flex-1 py-2 font-bold text-gray-400 border-b-2 border-transparent hover:text-white">회원가입</button>
            </div>

            <!-- Login Form -->
            <div id="loginForm">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">아이디 (게임 닉네임)</label>
                        <input type="text" id="loginId" placeholder="예: DOKDO로이 또는 seungki" class="w-full border border-gray-700 rounded p-2.5 focus:border-cyanAccent outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">비밀번호</label>
                        <input type="password" id="loginPw" placeholder="비밀번호 입력" class="w-full border border-gray-700 rounded p-2.5 focus:border-cyanAccent outline-none">
                    </div>
                    <button onclick="handleLogin()" class="w-full bg-cyanAccent hover:bg-cyan-500 text-black font-bold py-3 rounded shadow transition mt-2">로그인</button>
                </div>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="hidden">
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">사용할 아이디 (클랜 명단 연동 닉네임)</label>
                        <input type="text" id="signupId" placeholder="예: DOKDO로이" class="w-full border border-gray-700 rounded p-2.5 focus:border-cyanAccent outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">비밀번호</label>
                        <input type="password" id="signupPw" placeholder="비밀번호 설정" class="w-full border border-gray-700 rounded p-2.5 focus:border-cyanAccent outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">클래스(직업)</label>
                            <select id="signupClass" class="w-full border border-gray-700 rounded p-2.5 outline-none">
                                <option>블러드스테인</option>
                                <option>바이퍼</option>
                                <option>카니지</option>
                                <option>그림리퍼</option>
                                <option>아카샤</option>
                            </select>
                        </div>
                    </div>
                    <p class="text-[11px] text-gray-400 mt-1">💡 신규 가입 시 기본 '일반' 등급으로 등록되며, 메인 관리자(seungki)가 추후 등급을 부여합니다.</p>
                    <button onclick="handleSignup()" class="w-full bg-gold hover:bg-amber-500 text-black font-bold py-3 rounded shadow transition mt-2">회원가입 및 명단 등록</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main App Layout (로그인 후 대시보드 및 메뉴) -->
    <div id="mainApp" class="hidden flex-1 flex flex-col md:flex-row">
        <aside class="w-full md:w-64 bg-cardBg border-r border-gray-800 p-4 flex flex-col justify-between">
            <div>
                <div class="flex items-center space-x-2 mb-8">
                    <i data-lucide="shield" class="text-gold w-8 h-8"></i>
                    <div>
                        <h2 class="font-black text-xl text-white tracking-wider">DOKDO</h2>
                        <span class="text-[10px] text-cyanAccent">CLAN SYSTEM</span>
                    </div>
                </div>

                <nav class="space-y-1">
                    <button onclick="switchTab('dashboard')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded text-sm font-semibold bg-cyanAccent/10 text-cyanAccent">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i><span>대시보드</span>
                    </button>
                    <button onclick="switchTab('notice')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded text-sm font-semibold text-gray-400 hover:bg-gray-800 hover:text-white">
                        <i data-lucide="megaphone" class="w-4 h-4"></i><span>공지사항</span>
                    </button>
                    <button onclick="switchTab('members')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded text-sm font-semibold text-gray-400 hover:bg-gray-800 hover:text-white">
                        <i data-lucide="users" class="w-4 h-4"></i><span>클랜원 명단</span>
                    </button>
                    <button onclick="switchTab('attendance')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded text-sm font-semibold text-gray-400 hover:bg-gray-800 hover:text-white">
                        <i data-lucide="calendar-check" class="w-4 h-4"></i><span>출석 체크</span>
                    </button>
                    <button onclick="switchTab('diamonds')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded text-sm font-semibold text-gray-400 hover:
