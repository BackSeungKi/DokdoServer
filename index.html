<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOKDO - VAMPIR CLAN SYSTEM</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131b2e',
                        borderBg: '#1e293b',
                        gold: '#f59e0b',
                        cyanAccent: '#06b6d4',
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase DB 연동 설정 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDummyKey_For_Static_Canvas_App",
            authDomain: "clan-dokdo-app.firebaseapp.com",
            projectId: "clan-dokdo-app",
            storageBucket: "clan-dokdo-app.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef123456789"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let state = {
            members: [],
            notices: [
                { id: 1, title: "DOKDO 클랜 시스템에 오신 것을 환영합니다.", content: "출석체크 및 다이아 정산을 편리하게 이용하세요." }
            ],
            attendance: {},
            accounts: {}
        };

        const docRef = doc(db, "artifacts", "clan-app", "public", "data", "clan", "mainState");

        signInAnonymously(auth).then(() => {
            onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    state = { ...state, ...snapshot.data() };
                    ensureMainAdminExists();
                    renderApp();
                } else {
                    ensureMainAdminExists();
                    saveStateToFirestore();
                }
            });
        }).catch(() => {
            const localData = localStorage.getItem("dokdo_state");
            if (localData) state = JSON.parse(localData);
            ensureMainAdminExists();
            renderApp();
        });

        // 지정된 메인 관리자 계정(seungki)이 항상 DB에 존재하도록 보장
        function ensureMainAdminExists() {
            state.accounts = state.accounts || {};
            state.members = state.members || [];

            // bski090805! 의 SHA-256 해시값
            const adminHash = "29b8c04e22618991a0c7ed59b964fefb3ba4df8cf738ae8590bcbe8f0e5aa370";

            state.accounts["seungki"] = {
                passwordHash: adminHash,
                role: "메인 관리자",
                class: "검사",
                cp: 999999
            };

            if (!state.members.some(m => m.username === "seungki")) {
                state.members.unshift({
                    username: "seungki",
                    class: "검사",
                    cp: 999999,
                    role: "메인 관리자"
                });
            }
        }

        window.saveStateToFirestore = function() {
            setDoc(docRef, state).catch(() => {
                localStorage.setItem("dokdo_state", JSON.stringify(state));
            });
        };

        window.getState = () => state;
        window.getCurrentUser = () => currentUser;
        window.setCurrentUser = (u) => { currentUser = u; renderApp(); };
    </script>

    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ================================================================= -->
    <!-- 📌 [로그인 & 회원가입 팝업 창] -->
    <!-- ================================================================= -->
    <div id="authModal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-cardBg border border-cyanAccent/30 rounded-xl p-6 w-full max-w-md shadow-2xl">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-extrabold text-cyanAccent tracking-widest">DOKDO</h1>
                <p class="text-xs text-gray-400 mt-1">VAMPIR CLAN MANAGEMENT SYSTEM</p>
            </div>

            <div class="flex border-b border-gray-700 mb-6">
                <button id="loginTabBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 font-bold text-cyanAccent border-b-2 border-cyanAccent">로그인</button>
                <button id="signupTabBtn" onclick="switchAuthTab('signup')" class="flex-1 py-2 font-bold text-gray-400 border-b-2 border-transparent hover:text-white">회원가입</button>
            </div>

            <!-- 로그인 폼 -->
            <div id="loginForm">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">아이디 (게임 닉네임)</label>
                        <input type="text" id="loginId" placeholder="예: DOKDO로이 또는 seungki" class="w-full bg-darkBg border border-gray-700 rounded p-2.5 text-white focus:border-cyanAccent outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">비밀번호</label>
                        <input type="password" id="loginPw" placeholder="비밀번호 입력" class="w-full bg-darkBg border border-gray-700 rounded p-2.5 text-white focus:border-cyanAccent outline-none">
                    </div>
                    <button onclick="handleLogin()" class="w-full bg-cyanAccent hover:bg-cyan-500 text-black font-bold py-3 rounded shadow transition mt-2">로그인</button>
                </div>
            </div>

            <!-- 회원가입 폼 -->
            <div id="signupForm" class="hidden">
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">사용할 아이디 (클랜 명단 연동 닉네임)</label>
                        <input type="text" id="signupId" placeholder="예: DOKDO로이" class="w-full bg-darkBg border border-gray-700 rounded p-2.5 text-white focus:border-cyanAccent outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">비밀번호</label>
                        <input type="password" id="signupPw" placeholder="비밀번호 설정" class="w-full bg-darkBg border border-gray-700 rounded p-2.5 text-white focus:border-cyanAccent outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">클래스(직업)</label>
                            <select id="signupClass" class="w-full bg-darkBg border border-gray-700 rounded p-2.5 text-white outline-none">
                                <option>검사</option>
                                <option>마법사</option>
                                <option>궁수</option>
                                <option>암살자</option>
                                <option>힐러</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">전투력</label>
                            <input type="number" id="signupCp" placeholder="예: 150000" class="w-full bg-darkBg border border-gray-700 rounded p-2.5 text-white outline-none">
                        </div>
                    </div>
                    <p class="text-[11px] text-gray-400 mt-1">💡 신규 가입 시 기본 '일반' 등급으로 등록되며, 메인 관리자(seungki)가 추후 등급을 부여합니다.</p>
                    <button onclick="handleSignup()" class="w-full bg-gold hover:bg-amber-500 text-black font-bold py-3 rounded shadow transition mt-2">회원가입 및 명단 등록</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================================================================= -->
    <!-- 📌 [메인 웹사이트 레이아웃] -->
    <!-- ================================================================= -->
    <div id="mainApp" class="hidden flex-1 flex flex-col md:flex-row">
        
        <!-- 좌측 사이드바 -->
        <aside class="w-full md:w-64 bg-cardBg border-r border-gray-800 p-4 flex flex-col justify-between">
            <div>
                <div class="flex items-center space-x-2 mb-8">
                    <i data-lucide="shield" class="text-gold w-8 h-8"></i>
                    <div>
                        <h2 class="font-black text-xl text-white tracking-wider">DOKDO</h2>
                        <span class="text-[10px] text-cyanAccent">CLAN SYSTEM</span>
                    </div>
                </div>

                <nav class="space-y-1">
                    <button onclick="switchTab('dashboard')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded text-sm font-semibold bg-cyanAccent/10 text-cyanAccent">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i><span>대시보드</span>
                    </button>
                    <button onclick="switchTab('notice')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded text-sm font-semibold text-gray-400 hover:bg-gray-800 hover:text-white">
                        <i data-lucide="megaphone" class="w-4 h-4"></i><span>공지사항</span>
                    </button>
                    <button onclick="switchTab('members')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded text-sm font-semibold text-gray-400 hover:bg-gray-800 hover:text-white">
                        <i data-lucide="users" class="w-4 h-4"></i><span>클랜원 명단</span>
                    </button>
                    <button onclick="switchTab('attendance')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded text-sm font-semibold text-gray-400 hover:bg-gray-800 hover:text-white">
                        <i data-lucide="calendar-check" class="w-4 h-4"></i><span>출석 체크</span>
                    </button>
                    <button onclick="switchTab('diamonds')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded text-sm font-semibold text-gray-400 hover:bg-gray-800 hover:text-white">
                        <i data-lucide="gem" class="w-4 h-4"></i><span>다이아 분배</span>
                    </button>
                </nav>
            </div>

            <div class="pt-4 border-t border-gray-800 flex items-center justify-between">
                <div>
                    <div id="userDisplayName" class="text-sm font-bold text-white">---</div>
                    <div id="userDisplayRole" class="text-xs text-gold">---</div>
                </div>
                <button onclick="handleLogout()" title="로그아웃" class="text-gray-400 hover:text-red-400">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </aside>

        <!-- 메인 콘텐츠 -->
        <main class="flex-1 p-6 overflow-y-auto">

            <!-- 1. 대시보드 페이지 -->
            <section id="tab-dashboard" class="tab-content active space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold text-white">클랜 대시보드</h2>
                    <span class="text-xs bg-cyanAccent/20 text-cyanAccent px-3 py-1 rounded-full border border-cyanAccent/30">실시간 연동 중</span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-cardBg p-5 rounded-lg border border-gray-800">
                        <span class="text-xs text-gray-400">전체 등록 클랜원</span>
                        <p id="dashTotalMembers" class="text-3xl font-black text-cyanAccent mt-1">0 명</p>
                    </div>
                    <div class="bg-cardBg p-5 rounded-lg border border-gray-800">
                        <span class="text-xs text-gray-400">클랜 총 전투력</span>
                        <p id="dashTotalCp" class="text-3xl font-black text-gold mt-1">0</p>
                    </div>
                    <div class="bg-cardBg p-5 rounded-lg border border-gray-800">
                        <span class="text-xs text-gray-400">평균 전투력</span>
                        <p id="dashAvgCp" class="text-3xl font-black text-white mt-1">0</p>
                    </div>
                </div>

                <div class="bg-cardBg p-5 rounded-lg border border-gray-800">
                    <h3 class="text-lg font-bold text-white mb-3 flex items-center space-x-2">
                        <i data-lucide="bell" class="w-5 h-5 text-gold"></i><span>주요 클랜 공지</span>
                    </h3>
                    <div id="dashNoticeContainer" class="space-y-2 text-sm text-gray-300">
                        <p class="text-gray-500">등록된 공지사항이 없습니다.</p>
                    </div>
                </div>
            </section>

            <!-- 2. 공지사항 페이지 -->
            <section id="tab-notice" class="tab-content space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold text-white">클랜 공지사항 및 규칙</h2>
                </div>

                <!-- 관리자/마스터/부마스터 전용 공지 등록 폼 -->
                <div id="adminNoticeForm" class="hidden bg-cardBg p-4 rounded-lg border border-amber
